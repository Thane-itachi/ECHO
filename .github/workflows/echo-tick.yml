# The scheduler a serverless deploy needs.
#
# ECHO's reminder worker used to be a process that never stopped (`python -m app.worker`).
# A Vercel function is frozen between requests, so the loop became one endpoint that does
# a single pass, and something outside has to call it. Vercel's own cron on the Hobby plan
# runs at most once a day, which is not a reminder service, so this runs every five
# minutes instead. Two schedulers are harmless: job claiming uses SKIP LOCKED and every
# outbox row has an idempotency key, so an overlapping pair cannot send twice.
#
# Set the two repository secrets once:
#   ECHO_APP_URL     https://<your-project>.vercel.app
#   ECHO_CRON_SECRET the same value as ECHO_CRON_SECRET in the Vercel project
name: echo-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: echo-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Do one pass of the reminder worker
        env:
          APP_URL: ${{ secrets.ECHO_APP_URL }}
          CRON_SECRET: ${{ secrets.ECHO_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::ECHO_APP_URL and ECHO_CRON_SECRET must be set as repository secrets"
            exit 1
          fi
          # --retry so a single cold-start 5xx does not lose this window.
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            -X POST "$APP_URL/api/internal/tick" \
            -H "Authorization: Bearer $CRON_SECRET"

<!doctype html>
<html lang="en" data-ready="0">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECHO · navy design reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0B1120; --surface:#111A2E; --elevated:#1A2540; --border:#232E4A;
  --accent:#7C6CFF; --accent-soft:#A79BFF; --mint:#4ADE80; --amber:#FBBF24;
  --text:#E6EAF4; --muted:#8B95AD; --dim:#5E6880;
  --radius:14px; --radius-lg:18px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ring:0 0 0 3px rgba(124,108,255,.22);
  --lift:0 18px 40px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; letter-spacing:-0.005em;
}
.screen{width:100vw;height:100vh;overflow:hidden;position:relative;display:flex}
.screen::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(760px 420px at 78% -12%,rgba(124,108,255,.16),transparent 72%),
             radial-gradient(600px 380px at 6% 104%,rgba(124,108,255,.07),transparent 70%);
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dim{color:var(--dim)}

/* ---------------------------------------------------------------- icons */
.g{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.g svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------------------------------------------------------------- topbar */
.app{display:grid;grid-template-rows:64px 1fr;width:100%;height:100%;position:relative;z-index:1}
.topbar{
  display:grid;grid-template-columns:260px 1fr auto;align-items:center;
  border-bottom:1px solid var(--border);padding-right:18px;
  background:linear-gradient(180deg,rgba(17,26,46,.62),rgba(11,17,32,.2));
}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px;min-width:0}
.glyph{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#0B1120;
  background:linear-gradient(150deg,var(--accent-soft),var(--accent));
  box-shadow:0 0 0 1px rgba(167,155,255,.35),0 8px 18px -10px rgba(124,108,255,.9);
  font-size:13px;font-weight:700;
}
.wordmark{font-weight:600;letter-spacing:.16em;font-size:13px}
.plan-pill{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-soft);
  border:1px solid rgba(124,108,255,.34);background:rgba(124,108,255,.12);
  padding:2px 7px;border-radius:999px;margin-left:2px;
}
.searchbar{
  display:flex;align-items:center;gap:9px;height:36px;max-width:420px;width:100%;
  padding:0 12px;border:1px solid var(--border);border-radius:11px;
  background:rgba(17,26,46,.9);color:var(--muted);font-size:13px;
}
.searchbar .kbd{margin-left:auto}
.kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--border);
  background:var(--elevated);border-radius:6px;padding:1px 6px;line-height:1.5;
}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  border:1px solid transparent;
}
.icon-btn:hover{color:var(--text);background:var(--surface);border-color:var(--border)}
.dot-flag{position:absolute;margin:-14px 0 0 14px;width:6px;height:6px;border-radius:50%;background:var(--accent-soft)}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
  color:#0B1120;background:linear-gradient(150deg,#BEF2D2,var(--mint));margin-left:8px;
}

/* ---------------------------------------------------------------- shell body */
.body{display:grid;grid-template-columns:260px 1fr 320px;min-height:0}
.body.two{grid-template-columns:260px 1fr}

/* sidebar */
.sidebar{border-right:1px solid var(--border);padding:16px 12px 14px;display:flex;flex-direction:column;gap:2px;min-height:0}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);padding:6px 10px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;
  color:var(--muted);font-size:13.5px;font-weight:450;position:relative;
}
.nav-item .g{color:var(--dim)}
.nav-item.is-active{background:rgba(124,108,255,.13);color:var(--text);box-shadow:inset 0 0 0 1px rgba(124,108,255,.22)}
.nav-item.is-active .g{color:var(--accent-soft)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.nav-item.is-active .count{color:var(--accent-soft)}
.divider{height:1px;background:var(--border);margin:12px 10px}
.soon{
  margin-left:auto;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);
  border-radius:999px;padding:1px 6px;
}
.plan-card{
  margin-top:auto;border:1px solid var(--border);border-radius:12px;padding:12px;
  background:linear-gradient(160deg,rgba(26,37,64,.9),rgba(17,26,46,.6));
}
.plan-card .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.plan-card .t{font-size:12px;font-weight:550}
.plan-card .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.meter{height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;width:41%;background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
.plan-card button{
  margin-top:10px;width:100%;height:30px;border-radius:9px;font-size:12px;font-weight:550;
  color:var(--text);border:1px solid rgba(124,108,255,.36);background:rgba(124,108,255,.14);
}

/* main + rail */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.rail{border-left:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;background:rgba(17,26,46,.34)}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.rail-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rail-search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px;
  border:1px solid var(--border);background:rgba(11,17,32,.6);color:var(--dim);font-size:12px;
}

/* conversation */
.convo-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 26px;border-bottom:1px solid var(--border);
}
.convo-head h2{font-size:14.5px;font-weight:560;letter-spacing:-0.01em}
.convo-meta{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:7px;margin-top:3px}
.stream{flex:1;overflow:hidden;padding:24px 26px;display:flex;flex-direction:column;gap:18px}
.sys-pill{
  align-self:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:rgba(17,26,46,.7);
}
.msg{display:flex;gap:11px;max-width:92%}
.msg .av{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--elevated);border:1px solid var(--border);color:var(--accent-soft);font-size:12px;font-weight:600;
}
.msg.assistant .bubble{
  background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 5px;
  padding:14px 16px;font-size:14px;line-height:1.62;max-width:640px;
}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.user .bubble{
  background:rgba(124,108,255,.14);border:1px solid rgba(124,108,255,.3);
  border-radius:14px 14px 5px 14px;padding:12px 15px;max-width:460px;font-size:14px;
}
.cite{
  font-family:var(--mono);font-size:10px;vertical-align:top;color:var(--accent-soft);
  border:1px solid rgba(124,108,255,.3);background:rgba(124,108,255,.14);border-radius:5px;padding:0 3px;margin-left:2px;
}
.msg-tools{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:11px;color:var(--dim)}
.msg-tools span:hover{color:var(--muted)}

/* recall chip + list */
.recall-chip{
  display:inline-flex;align-items:center;gap:8px;height:27px;padding:0 11px;border-radius:999px;
  border:1px solid rgba(74,222,128,.28);background:rgba(74,222,128,.1);
  color:#BEF2D2;font-size:11.5px;font-weight:500;margin-top:10px;
}
.recall-chip .brain{color:var(--mint)}
.recall-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:600px}
.mem-card{
  border:1px solid var(--border);border-radius:11px;background:rgba(11,17,32,.55);padding:10px 12px;
}
.mem-card:hover{border-color:rgba(167,155,255,.4)}
.mem-card .top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.mem-card .title{font-size:12.5px;font-weight:520;color:var(--text)}
.mem-card .snippet{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.bar{display:flex;align-items:center;gap:7px;margin-top:8px}
.bar .track{height:3px;border-radius:999px;background:rgba(255,255,255,.08);flex:1;overflow:hidden;max-width:150px}
.bar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#8BF3AE)}
.bar .score{font-family:var(--mono);font-size:10px;color:var(--mint)}
.tags{display:flex;gap:5px;margin-left:auto}
.tag{
  font-size:10px;letter-spacing:.02em;color:var(--muted);border:1px solid var(--border);
  background:rgba(26,37,64,.7);border-radius:999px;padding:1px 7px;
}
.tag.mint{color:#9BE9B8;border-color:rgba(74,222,128,.26);background:rgba(74,222,128,.1)}
.tag.amber{color:#F8D383;border-color:rgba(251,191,36,.26);background:rgba(251,191,36,.1)}
.pin-mark{width:14px;height:14px;color:var(--amber)}

/* composer */
.composer-wrap{padding:0 26px 22px}
.composer{
  border:1px solid var(--border);border-radius:var(--radius-lg);background:rgba(17,26,46,.96);
  box-shadow:var(--lift);padding:12px 12px 10px 16px;
}
.composer .input{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14px;min-height:34px}
.composer .input .caret{display:inline-block;width:1.5px;height:16px;background:var(--accent-soft);margin-left:-6px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.composer-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.pin-toggle{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;
  border:1px solid var(--border);color:var(--muted);font-size:11.5px;
}
.pin-toggle.on{color:#F8D383;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.1)}
.send{
  margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#0B1120;
  background:linear-gradient(150deg,var(--accent-soft),var(--accent));box-shadow:0 0 0 4px rgba(124,108,255,.13);
}
.hint{font-size:10.5px;color:var(--dim);margin-top:9px;display:flex;justify-content:space-between;padding:0 4px}

.mem-card .when{font-size:9.5px;color:var(--dim);flex:0 0 auto}
.remind-confirm{
  display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border-radius:9px;margin-top:9px;
  border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.09);font-size:11.5px;color:#F8D383;
}
.remind-confirm .t{color:var(--text)}
.remind-confirm .when{font-size:10px;color:#F8D383}
.suggest-row{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.suggest-label{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-right:2px}

/* recall detail shot */
.detail-stage{flex:1;display:grid;place-items:center;padding:56px 72px;position:relative;z-index:1;overflow:hidden}
.detail-col{width:100%;max-width:940px}
.detail-h{font-size:42px;font-weight:560;letter-spacing:-0.038em;line-height:1.06}
.detail-sub{font-size:13.5px;color:var(--muted);margin-top:12px;max-width:520px}
.detail-col .bubble{font-size:15.5px;max-width:none;padding:18px 20px}
.detail-col .mem-card{padding:13px 15px}
.detail-col .mem-card .title{font-size:14.5px}
.detail-col .mem-card .snippet{font-size:13px}
.detail-col .mem-card .when{font-size:10.5px}
.detail-col .recall-chip{height:29px;font-size:12px}
.detail-col .bar .track{max-width:210px;height:4px}
.detail-col .bar .score{font-size:11px}
.detail-col .tag{font-size:10.5px}
.detail-col .av{width:32px;height:32px;border-radius:10px;font-size:13px}

/* recent rows */
.panel-doc .mem-card .title{font-size:14px}
.panel-doc .mem-card .snippet{font-size:12.5px}
.panel-doc .recent{font-size:12.5px}
.panel-doc .rail-title{font-size:10.5px}
.recent{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(35,46,74,.7);font-size:11.5px;color:var(--muted);min-width:0}
.recent .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.recent .rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.recent .when{margin-left:auto;font-size:9.5px;color:var(--dim);flex:0 0 auto}

/* ---------------------------------------------------------------- dashboard */
.page{padding:26px 30px 30px;overflow:hidden;display:flex;flex-direction:column;gap:18px;min-height:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:26px;font-weight:560;letter-spacing:-0.025em}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:6px}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:5px;max-width:560px}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:rgba(11,17,32,.6)}
.seg span{font-size:11.5px;padding:5px 11px;color:var(--muted)}
.seg span.on{background:rgba(124,108,255,.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(124,108,255,.24)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{
  border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(165deg,rgba(26,37,64,.75),rgba(17,26,46,.85));
  padding:16px 18px;min-width:0;
}
.card .label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card .value{font-size:28px;font-weight:560;letter-spacing:-0.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.card .delta{font-size:11px;color:var(--mint);display:flex;align-items:center;gap:5px;margin-top:2px}
.card .delta.flat{color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:10px}
.spark i{width:6px;border-radius:2px;background:linear-gradient(180deg,var(--accent-soft),rgba(124,108,255,.28))}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;min-height:0;flex:1}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.card-title{font-size:13px;font-weight:540}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted)}
.legend b{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;
  background:rgba(11,17,32,.55);
}
.chip b{color:var(--text);font-weight:500}
.chip.on{color:var(--text);border-color:rgba(167,155,255,.45);background:rgba(124,108,255,.14)}
.feed{display:flex;flex-direction:column;gap:0;margin-top:6px}
.feed-row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid rgba(35,46,74,.7);font-size:12px}
.feed-row:last-child{border-bottom:0}
.feed-row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-soft);margin-top:7px;flex:0 0 auto}
.feed-row .dot.mint{background:var(--mint)}
.feed-row .dot.amber{background:var(--amber)}
.feed-row .when{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.suggest{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(35,46,74,.7);font-size:12px}
.suggest:last-child{border-bottom:0}
.suggest button{
  margin-left:auto;font-size:11px;color:var(--accent-soft);border:1px solid rgba(124,108,255,.3);
  background:rgba(124,108,255,.12);border-radius:7px;padding:2px 8px;white-space:nowrap;
}

/* ---------------------------------------------------------------- library */
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:1px solid var(--border)}
.lib-search{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;min-width:280px;
  border:1px solid var(--border);background:rgba(11,17,32,.6);color:var(--muted);font-size:12.5px;
}
.lib-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px 26px;overflow:hidden}
.lib-card{
  border:1px solid var(--border);border-radius:13px;background:linear-gradient(165deg,rgba(26,37,64,.6),rgba(17,26,46,.8));
  padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0;
}
.lib-card.hover{border-color:rgba(167,155,255,.5);box-shadow:0 0 0 1px rgba(124,108,255,.16),0 14px 30px -22px rgba(124,108,255,.9)}
.lib-card.selected{border-color:rgba(124,108,255,.55);background:linear-gradient(165deg,rgba(124,108,255,.16),rgba(17,26,46,.85))}
.lib-card .check{
  position:absolute;top:12px;right:12px;width:16px;height:16px;border-radius:5px;border:1px solid var(--border);
  display:grid;place-items:center;background:rgba(11,17,32,.7);color:#0B1120;
}
.lib-card.selected .check{background:var(--accent);border-color:var(--accent)}
.lib-card .check svg{width:10px;height:10px;stroke-width:3}
.lib-card h3{font-size:13px;font-weight:540;line-height:1.4;padding-right:22px}
.lib-card p{font-size:11.5px;color:var(--muted);line-height:1.5}
.lib-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid rgba(35,46,74,.8);font-size:10px;color:var(--dim)}
.lib-foot .src{margin-left:auto;font-family:var(--mono)}
.row-actions{display:flex;gap:4px;position:absolute;bottom:10px;right:10px}
.row-actions button{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);
  border:1px solid var(--border);background:var(--elevated);
}
.bulk{
  display:flex;align-items:center;gap:12px;margin:0 26px 18px;padding:9px 14px;border-radius:11px;
  border:1px solid rgba(124,108,255,.32);background:rgba(124,108,255,.12);font-size:12px;
}
.bulk .act{margin-left:auto;display:flex;gap:8px}
.bulk .act span{font-size:11.5px;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:2px 9px;background:rgba(11,17,32,.5)}
.bulk .act span.danger{color:#FFA79B;border-color:rgba(255,140,120,.3)}

/* ---------------------------------------------------------------- palette */
.dimmed{filter:blur(3px) brightness(.55);transform:scale(1.005)}
.palette-backdrop{position:absolute;inset:0;z-index:5;display:grid;place-items:start center;padding-top:15vh;background:rgba(6,10,20,.55)}
.palette{width:620px;border-radius:16px;border:1px solid rgba(124,108,255,.28);background:rgba(17,26,46,.96);box-shadow:0 40px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.03);overflow:hidden}
.palette .input{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--border)}
.palette .input .q{font-size:14.5px;color:var(--text)}
.palette .input .q b{color:var(--accent-soft);font-weight:500}
.p-group{padding:8px 8px 4px}
.p-group .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:6px 10px}
.p-row{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--muted)}
.p-row .g{color:var(--dim)}
.p-row.on{background:rgba(124,108,255,.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(124,108,255,.26)}
.p-row.on .g{color:var(--accent-soft)}
.p-row .meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim)}
.palette .foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dim)}

/* ---------------------------------------------------------------- mobile */
.mobile-screen{display:grid;place-items:center;padding:0}
.phone{
  width:393px;height:852px;border-radius:44px;position:relative;
  border:1px solid rgba(255,255,255,.1);background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 10px #0d1322,0 0 0 11px #1b2540,0 50px 90px -40px rgba(0,0,0,1);
  display:grid;grid-template-rows:31px 56px 1fr auto;
}
.status{display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:11px;font-weight:600;letter-spacing:.01em}
.status .icons{display:flex;gap:5px;align-items:center;color:var(--text)}
.m-head{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.m-head .ttl{font-size:12.5px;font-weight:520}
.m-head .sub{font-size:10px;color:var(--dim)}
.m-stream{padding:14px 14px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.m-stream .msg{max-width:100%}
.m-stream .msg.assistant .bubble,.m-stream .msg.user .bubble{font-size:12.5px;padding:10px 12px;max-width:none}
.m-composer{padding:10px 12px 22px;border-top:1px solid var(--border);background:rgba(17,26,46,.8)}
.m-input{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:14px;background:rgba(11,17,32,.7);padding:9px 10px}
.m-input .ph{font-size:12px;color:var(--dim);flex:1}
.home-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:999px;background:rgba(230,234,244,.4)}

/* ---------------------------------------------------------------- login / onboarding */
.center-stage{flex:1;display:grid;place-items:center;position:relative;z-index:1;padding:40px}
.login-split{display:grid;grid-template-columns:1.15fr .85fr;width:100%;height:100%;position:relative;z-index:1}
.login-left{padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.login-left h1{font-size:44px;line-height:1.1;letter-spacing:-0.035em;font-weight:560;max-width:520px}
.login-left p{font-size:14px;color:var(--muted);max-width:420px;margin-top:16px}
.login-right{display:grid;place-items:center;padding:40px 60px 40px 20px;position:relative}
.rings{position:absolute;inset:0;display:grid;place-items:center;opacity:.5;pointer-events:none}
.glass-card{
  width:100%;max-width:390px;border-radius:var(--radius-lg);padding:28px;position:relative;
  border:1px solid rgba(124,108,255,.22);background:linear-gradient(165deg,rgba(26,37,64,.92),rgba(17,26,46,.92));
  box-shadow:0 40px 90px -46px rgba(124,108,255,.75),0 0 0 1px rgba(255,255,255,.03);
}
.glass-card h2{font-size:19px;font-weight:560;letter-spacing:-0.02em}
.glass-card .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.field{margin-top:16px}
.field label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field .input{
  height:40px;border-radius:11px;border:1px solid var(--border);background:rgba(11,17,32,.7);
  display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--dim);
}
.field .input.focus{border-color:rgba(124,108,255,.6);box-shadow:var(--ring);color:var(--text)}
.btn-primary{
  width:100%;height:42px;border-radius:11px;margin-top:20px;font-size:13.5px;font-weight:560;color:#0B1120;
  background:linear-gradient(150deg,var(--accent-soft),var(--accent));
  box-shadow:0 14px 30px -16px rgba(124,108,255,.95);
}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:11.5px;color:var(--dim)}
.card-foot a{color:var(--accent-soft);text-decoration:none}
.statement{font-size:12px;color:var(--dim);letter-spacing:.02em}
.onboard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;max-width:660px}
.onboard h1{font-size:38px;font-weight:560;letter-spacing:-0.035em;margin-top:26px}
.onboard p{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:460px}
.onboard .chips{justify-content:center;margin-top:22px}
.onboard .cta{
  margin-top:26px;height:42px;padding:0 26px;border-radius:11px;font-size:13.5px;font-weight:560;color:#0B1120;
  background:linear-gradient(150deg,var(--accent-soft),var(--accent));box-shadow:0 18px 40px -20px rgba(124,108,255,.95);
}
.onboard .fine{font-size:11px;color:var(--dim);margin-top:16px}

/* ---------------------------------------------------------------- design sheet */
.sheet{padding:34px 40px;display:flex;flex-direction:column;gap:20px;overflow:hidden;position:relative;z-index:1}
.sheet-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px}
.sheet-head h1{font-size:22px;font-weight:560;letter-spacing:-0.03em}
.sheet-cols{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:26px;min-height:0}
.col-title{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.swatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{border-radius:10px;border:1px solid var(--border);overflow:hidden;background:rgba(17,26,46,.6)}
.swatch .fill{height:34px}
.swatch .meta{display:flex;justify-content:space-between;padding:5px 8px;font-size:9.5px;color:var(--muted)}
.swatch .meta .hex{font-family:var(--mono);color:var(--dim)}
.type-row{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid rgba(35,46,74,.6)}
.type-row .spec{font-family:var(--mono);font-size:9.5px;color:var(--dim);width:58px;flex:0 0 auto}
.specimen{display:flex;flex-direction:column;gap:10px}
.spec-row{display:flex;align-items:center;gap:10px}
.btn{height:32px;padding:0 14px;border-radius:9px;font-size:12px;font-weight:520;display:inline-flex;align-items:center;gap:7px}
.btn.primary{color:#0B1120;background:linear-gradient(150deg,var(--accent-soft),var(--accent))}
.btn.secondary{color:var(--text);border:1px solid var(--border);background:rgba(26,37,64,.8)}
.btn.ghost{color:var(--muted);border:1px solid transparent}
.btn.danger{color:#FFA79B;border:1px solid rgba(255,140,120,.3);background:rgba(255,120,100,.1)}
.toggle{width:34px;height:19px;border-radius:999px;background:rgba(124,108,255,.85);position:relative;display:inline-block}
.toggle i{position:absolute;top:2.5px;left:17px;width:14px;height:14px;border-radius:50%;background:#fff}
.toggle.off{background:rgba(255,255,255,.13)}
.toggle.off i{left:2.5px;background:var(--muted)}
</style>
</head>

/* ------------------------------------------------------------------ chrome */
function topbar(){

function memCard(m, opts={}){
  const used = opts.used;
  return `<div class="mem-card">
    <div class="top">
      <span class="title">${m.t}</span>
      <span class="mono when">${m.when}</span>

      <span class="track"><i style="width:${Math.round(m.score*100)}%"></i></span>
      <span class="score">${m.score.toFixed(2)}</span>
      ${used
        ? `<span class="tag mint" style="margin-left:auto">used in answer</span>`
        : `<span class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span>`}
    </div>
  </div>`;
}
